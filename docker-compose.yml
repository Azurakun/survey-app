version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: survey-pasar-app
    restart: always
    ports:
      - "8085:80"
    environment:
      - APP_NAME="Platform Survey Riset Pasar"
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://barbra-inexpugnable-stuporously.ngrok-free.dev
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - app_storage:/var/www/html/storage
      - app_db:/var/www/html/database

  ngrok:
    image: ngrok/ngrok:latest
    container_name: survey-pasar-ngrok
    restart: always
    command:
      - "http"
      - "app:80"
      - "--url=barbra-inexpugnable-stuporously.ngrok-free.dev"
    environment:
      - NGROK_AUTHTOKEN=3GsykWaQ60YQClhM3TSrQ8II3pu_muZVnzgtyBtGVHJ2FiZ9
    ports:
      - "4045:4040"

volumes:
  app_storage:
  app_db:
