version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: survey-pasar-app
    restart: always
    ports:
      - "8085:80"
    environment:
      - APP_NAME="Platform Survey Riset Pasar"
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://192.168.1.222:8085
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - app_storage:/var/www/html/storage
      - app_db:/var/www/html/database

volumes:
  app_storage:
  app_db:
